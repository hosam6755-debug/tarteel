<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Turquoise Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="45%" stop-color="#0d9488" />
      <stop offset="75%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4d0" />
      <stop offset="25%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Soft Gold Gradient for Borders -->
    <linearGradient id="borderGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#fbbf24" flood-opacity="0.35"/>
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with Turquoise Gradient -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGold)" stroke-width="4" filter="url(#subtleShadow)" />

  <!-- Subtle Islamic Geometric Background Watermark Pattern -->
  <g opacity="0.09" stroke="#fff" stroke-width="2" fill="none">
    <rect x="106" y="106" width="300" height="300" rx="20" transform="rotate(45 256 256)" />
    <rect x="106" y="106" width="300" height="300" rx="20" />
    <circle cx="256" cy="256" r="160" />
    <circle cx="256" cy="256" r="190" stroke-dasharray="6,6" />
  </g>

  <!-- Ornate Islamic Inner Frame -->
  <rect x="42" y="42" width="428" height="428" rx="84" fill="none" stroke="url(#borderGold)" stroke-width="2.5" opacity="0.65" />
  <rect x="52" y="52" width="408" height="408" rx="76" fill="none" stroke="url(#borderGold)" stroke-width="1" stroke-dasharray="4,4" opacity="0.5" />

  <!-- Corner Flourishes / Islamic Rub El Hizb Accents -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <!-- Top-Right -->
    <path d="M 400 70 Q 442 70 442 112 Q 425 95 400 70 Z" />
    <circle cx="410" cy="102" r="3.5" />
    <!-- Top-Left -->
    <path d="M 112 70 Q 70 70 70 112 Q 87 95 112 70 Z" />
    <circle cx="102" cy="102" r="3.5" />
    <!-- Bottom-Right -->
    <path d="M 400 442 Q 442 442 442 400 Q 425 417 400 442 Z" />
    <circle cx="410" cy="410" r="3.5" />
    <!-- Bottom-Left -->
    <path d="M 112 442 Q 70 442 70 400 Q 87 417 112 442 Z" />
    <circle cx="102" cy="410" r="3.5" />
  </g>

  <!-- Central Islamic Medallion / Arch Crest -->
  <g filter="url(#goldGlow)">
    <!-- Quran Arch Motif at the top -->
    <path d="M 230 148 C 242 136 270 136 282 148 C 290 156 302 164 316 166 C 304 172 292 170 284 164 C 272 154 240 154 228 164 C 220 170 208 172 196 166 C 210 164 222 156 230 148 Z" fill="url(#goldGrad)" />
    <circle cx="256" cy="132" r="6" fill="url(#goldGrad)" />
    <polygon points="256,118 259,126 267,126 261,131 263,139 256,134 249,139 251,131 245,126 253,126" fill="url(#goldGrad)" />
  </g>

  <!-- Central Master Calligraphy: "ترتيل" -->
  <g filter="url(#goldGlow)">
    <text x="256" y="295" font-family="'Amiri', 'Amiri Quran', 'Scheherazade New', serif" font-size="118" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">
      ترتيل
    </text>
  </g>

  <!-- Subtle Decorative Underline / Swash -->
  <g filter="url(#goldGlow)">
    <path d="M 160 330 C 210 345 302 345 352 330 C 330 338 280 346 256 346 C 232 346 182 338 160 330 Z" fill="url(#goldGrad)" />
    <circle cx="256" cy="354" r="3" fill="url(#goldGrad)" />
    <circle cx="240" cy="354" r="2" fill="url(#goldGrad)" />
    <circle cx="272" cy="354" r="2" fill="url(#goldGrad)" />
  </g>

  <!-- Latin Sub-Brand in Classic Serif -->
  <text x="256" y="396" font-family="'Outfit', 'Trajan Pro', serif" font-size="28" font-weight="700" letter-spacing="8" fill="#fde68a" text-anchor="middle" opacity="0.95">
    TARTEEL
  </text>
  <text x="256" y="422" font-family="'Cairo', sans-serif" font-size="15" font-weight="600" letter-spacing="2" fill="#99f6e4" text-anchor="middle" opacity="0.8">
    صانع فيديوهات القرآن الكريم
  </text>
</svg>
